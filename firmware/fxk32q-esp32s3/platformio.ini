; FXK32Q — ESP32-S3 + 2× 16ch relay boards (IFMx-i32Q replica, enhanced)
; Build:  pio run
; Upload: pio run -t upload
; Monitor: pio device monitor

[env:esp32-s3-devkitc-1]
platform   = espressif32
board      = esp32-s3-devkitc-1
framework  = arduino
monitor_speed = 115200
upload_speed  = 921600

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=2
    -DFXK32Q_FW_VERSION=\"1.0.0\"
    ; Optional bench self-test — pulses each of the 32 relays at boot.
    ; Refuses to run unless UNSAFE_GPIO_JUMPER (GPIO21) is shorted to GND.
    ; -DFXK32Q_BOOT_SELFTEST
    ; -DFXK32Q_SELFTEST_PULSE_MS=30
    ; -DFXK32Q_SELFTEST_GAP_MS=70

lib_deps =
    h2zero/NimBLE-Arduino@^1.4.1

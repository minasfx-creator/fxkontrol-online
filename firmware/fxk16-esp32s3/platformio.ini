; FXK16 — ESP32-S3 v1.3 firmware
; Build:  pio run
; Upload: pio run -t upload
; Monitor: pio device monitor

[env:esp32-s3-devkitc-1]
platform   = espressif32
board      = esp32-s3-devkitc-1
framework  = arduino
monitor_speed = 115200
upload_speed  = 921600

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=2
    -DFXK16_FW_VERSION=\"1.0.0\"
    ; Optional: bench bring-up self-test. Pulses each relay 30ms at boot.
    ; Refuses to run unless UNSAFE_GPIO_JUMPER (GPIO21) is shorted to GND
    ; and ESTOP is released — safe to leave enabled in dev builds, but DO
    ; NOT ship to field with this flag set.
    ; -DFXK16_BOOT_SELFTEST
    ; -DFXK16_SELFTEST_PULSE_MS=30
    ; -DFXK16_SELFTEST_GAP_MS=70

lib_deps =
    h2zero/NimBLE-Arduino@^1.4.1

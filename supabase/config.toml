# ──────────────────────────────────────────────────────────────────────
# Hardware bridges — tolerated as JWT-optional because devices on the
# field network may not always have a fresh user session. Inputs are
# bounded and there is no AI/paid quota at risk.
# ──────────────────────────────────────────────────────────────────────
[functions.artnet-bridge]
verify_jwt = false

[functions.mavlink-bridge]
verify_jwt = false

# ──────────────────────────────────────────────────────────────────────
# Marketplace publish — used by tooling/admins outside the app. Keep
# JWT-optional but the handler must verify a publisher key in code.
# ──────────────────────────────────────────────────────────────────────
[functions.marketplace-publish]
verify_jwt = false

# ──────────────────────────────────────────────────────────────────────
# Internal queue worker — already JWT-required (cron/service).
# ──────────────────────────────────────────────────────────────────────
[functions.process-email-queue]
verify_jwt = true
